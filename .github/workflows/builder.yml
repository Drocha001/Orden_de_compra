name: Build APK with Buildozer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up environment
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache git zip unzip openjdk-11-jdk python3-pip python3-setuptools python3-wheel python3-venv libncurses5
        pip install --upgrade pip
        pip install --user buildozer cython

    - name: Install buildozer deps
      run: |
        sudo apt install -y python3-pip python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
          libgstreamer1.0 libgstreamer1.0-dev libmtdev-dev libgl1-mesa-dev libgles2-mesa-dev \
          libgstreamer-plugins-base1.0-dev libffi-dev libjpeg-dev libpng-dev libfreetype6-dev

    - name: Build APK
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: KivyApp-APK
        path: bin/*.apk
