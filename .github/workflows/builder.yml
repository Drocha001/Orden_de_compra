name: Build APK with Buildozer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up environment
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache git zip unzip openjdk-11-jdk python3-pip python3-setuptools python3-wheel python3-venv libncurses5
        pip install --upgrade pip
        pip install --user buildozer cython

    - name: Install buildozer deps
      run: |
        sudo apt install -y python3-pip python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          libgstreamer1.0-0 libgstreamer-plugins-base1.0-dev
        sudo apt install -y libffi-dev libssl-dev
        sudo apt install -y liblzma-dev zlib1g-dev

    - name: Build APK
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KivyApp-APK
        path: bin/*.apk
