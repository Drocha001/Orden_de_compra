name: Build APK for Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up environment
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache git zip unzip openjdk-11-jdk python3-pip python3-setuptools python3-wheel python3-venv libncurses5
        pip install --upgrade pip
        pip install --user buildozer cython

    - name: Install dependencies for Buildozer
      run: |
        sudo apt install -y python3-pip python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x \
          gstreamer1.0-alsa gstreamer1.0-pulseaudio libffi-dev libssl-dev liblzma-dev zlib1g-dev

    - name: Install Android SDK and NDK
      run: |
        sudo apt install -y wget
        wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O cmdline-tools.zip
        mkdir -p $HOME/android/cmdline-tools
        unzip cmdline-tools.zip -d $HOME/android/cmdline-tools
        export ANDROID_HOME=$HOME/android
        export PATH=$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;21.4.7075529"

    - name: Build APK
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KivyApp-APK
        path: bin/*.apk
